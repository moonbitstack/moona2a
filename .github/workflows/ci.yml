name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            # The conformance server runs until it is stopped, and the conformance job is what
            # starts it.
            case "$(basename "$dir")" in
              05-conformance) continue ;;
            esac
            moon run "$dir" --target native > /dev/null
          done

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

  conformance:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: official conformance suite
        run: scripts/conformance/check.sh
